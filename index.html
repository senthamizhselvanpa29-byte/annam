<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Annam: a free calorie and nutrition tracker in English, Tamil and Hindi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Annam Calorie Tracker</title>
<meta name="theme-color" content="#3B2F8F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

<style>
/* Layout: phone-first single column app, sticky top bar, fixed bottom tab bar, sheets slide up from the bottom */
:root{
  --bg:#F5F4FA; --surface:#FFFFFF; --surface2:#EEECF7; --ink:#1E1A3A; --muted:#6B6785; --line:#E2DFEE;
  --brand:#3B2F8F; --brand-ink:#FFFFFF; --turmeric:#E8930C; --turmeric-soft:#FDF0DA;
  --protein:#D8456B; --carbs:#E8930C; --fat:#7A5AF8; --fibre:#2E9C8A; --over:#C8372D; --good:#2E8A55;
  --shadow:0 1px 2px rgba(30,26,58,.06),0 6px 20px rgba(30,26,58,.06);
  --display:"Baloo 2","Noto Sans Tamil","Noto Sans Devanagari",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans Tamil","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13111F; --surface:#1D1A2E; --surface2:#262239; --ink:#F1EFFA; --muted:#A39FBD; --line:#322D4A;
  --brand:#8E83F0; --brand-ink:#13111F; --turmeric:#F2A93B; --turmeric-soft:#3A2D16;
  --protein:#F0708F; --carbs:#F2A93B; --fat:#A08BFF; --fibre:#4FC2AE; --over:#F06A5E; --good:#5CC98A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#13111F; --surface:#1D1A2E; --surface2:#262239; --ink:#F1EFFA; --muted:#A39FBD; --line:#322D4A;
  --brand:#8E83F0; --brand-ink:#13111F; --turmeric:#F2A93B; --turmeric-soft:#3A2D16;
  --protein:#F0708F; --carbs:#F2A93B; --fat:#A08BFF; --fibre:#4FC2AE; --over:#F06A5E; --good:#5CC98A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--turmeric);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo-mark{width:32px;height:32px;border-radius:10px;background:var(--turmeric);display:grid;place-items:center;flex:none}
.logo h1{font-size:24px;font-weight:800;letter-spacing:.2px}
.logo small{display:block;font-size:12px;opacity:.8;font-family:var(--body);font-weight:400}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:inherit;padding:4px 9px;border-radius:999px;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand);font-weight:600}
.icon-btn{border:0;background:rgba(255,255,255,.14);color:inherit;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}

main{max-width:560px;margin:0 auto;padding-block:14px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

.banner{background:var(--turmeric-soft);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13px}
.banner b{font-weight:600}
.banner button{margin-left:auto;flex:none;border:1px solid var(--turmeric);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px}

.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c strong{font-family:var(--display);font-size:30px;line-height:1}
.ring-c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat strong{font-family:var(--display);font-size:20px}
.macros{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:16px}
.macro .lbl{display:flex;justify-content:space-between;font-size:13px}
.macro .lbl b{font-weight:600}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}

.meal{display:grid;gap:8px}
.meal-h{display:flex;align-items:center;gap:10px}
.meal-h h3{font-size:18px;flex:1}
.meal-h .kc{font-size:13px;color:var(--muted)}
.chip-btn{border:0;background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip-btn.primary{background:var(--brand);color:var(--brand-ink)}
.entry{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.entry img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.entry .nm{flex:1;min-width:0}
.entry .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .nm small{color:var(--muted);font-size:12px}
.entry .kc{font-weight:600;font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:50%}
.empty{font-size:13px;color:var(--muted);padding:4px 0}

.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.glass{width:30px;height:38px;border:2px solid var(--fibre);border-radius:4px 4px 9px 9px;background:transparent;padding:0;position:relative;overflow:hidden}
.glass.on::after{content:"";position:absolute;inset:35% 0 0;background:var(--fibre);opacity:.7}

.snaps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.snaps img{width:78px;height:78px;border-radius:12px;object-fit:cover;flex:none}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:8px 2px 10px;font-size:11.5px;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--brand);font-weight:600}
.nav .plus{transform:translateY(-14px)}
.nav .plus span.o{width:56px;height:56px;border-radius:18px;background:var(--turmeric);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(232,147,12,.4)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,12,30,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;
  padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-size:22px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.food .nm{flex:1;min-width:0}
.food .nm small{display:block;color:var(--muted);font-size:12px}
.food .add{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;font-size:18px;color:var(--brand)}
.pick{background:var(--surface2);border-radius:16px;padding:12px;display:grid;gap:10px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);font-size:20px}
.stepper output{min-width:44px;text-align:center;font-weight:600}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--brand);color:var(--brand-ink);width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.photo-prev{width:100%;max-height:220px;object-fit:cover;border-radius:14px}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 10px}

/* report */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface2);border-radius:14px;padding:10px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi strong{font-family:var(--display);font-size:20px}
.insight{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.split i{display:block;height:100%}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* coach */
.chat{display:grid;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14.5px;white-space:pre-line}
.msg.bot{background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.msg.me{background:var(--brand);color:var(--brand-ink);justify-self:end;border-bottom-right-radius:4px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.quick button{flex:none;border:1px solid var(--brand);color:var(--brand);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px}
.ask button{border:0;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 16px;font-weight:600}

/* recipes */
.rgrid{display:grid;gap:12px}
.recipe{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.recipe-top{display:flex;gap:12px;padding:14px;align-items:center;width:100%;text-align:left;border:0;background:transparent}
.plate{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:20px}
.recipe-top .nm{flex:1;min-width:0}
.recipe-top h3{font-size:17px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;border-radius:99px;padding:2px 8px;background:var(--surface2);color:var(--muted)}
.recipe-body{padding:0 14px 14px;display:grid;gap:8px;font-size:14px}
.recipe-body ol,.recipe-body ul{margin:0;padding-left:20px;display:grid;gap:4px}

.entry .nm{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.conf{font-size:11px;border-radius:99px;padding:1px 7px;font-weight:600;white-space:nowrap;vertical-align:middle}
.conf.high{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.conf.medium{background:var(--turmeric-soft);color:var(--turmeric)}
.conf.low{background:color-mix(in srgb,var(--over) 15%,transparent);color:var(--over)}
.ai-item{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ai-item.off{opacity:.55}
.q{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.q .seg button{padding:5px 10px}
.q select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:14px;max-width:100%}
.mac{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.mac span[style]{border-left:3px solid var(--c);padding-left:5px}
.kc-big{font-family:var(--display);font-size:20px}.kc-big small{font-size:12px;color:var(--muted);font-family:var(--body)}
.food .tag{font-size:10px}
.bar i.loading{width:35%;background:var(--brand);animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (max-width:380px){.hero{grid-template-columns:110px 1fr}.ring{width:110px;height:110px}.ring-c strong{font-size:24px}.lang button{padding:4px 7px}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="logo">
    <div class="logo-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="15" rx="9" ry="4" fill="#fff"/><path d="M7 13c1-4 3-6 5-6s4 2 5 6" stroke="#3B2F8F" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="5" r="1.6" fill="#fff"/></svg></div>

  <button class="icon-btn" id="profileBtn" aria-label="Profile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
</div></header>

<main id="view"></main>

<nav class="nav"><div class="nav-in">

  <button data-tab="report"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span data-t="report"></span></button>
  <button class="plus" id="plusBtn" aria-label="Add food"><span class="o"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span data-t="add"></span></button>
  <button data-tab="coach"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg><span data-t="coach"></span></button>
  <button data-tab="recipes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 13h16a8 8 0 0 1-16 0z"/><path d="M9 9c0-2 2-2 2-4M14 9c0-2 2-2 2-4"/></svg><span data-t="recipes"></span></button>
</div></nav>

<div id="layer"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

  const scored=[];for(const f of FOODS){const hay=norm([f.en,f.ta,f.hi,f.local,f.id].join(" "));let sc=0;
    for(const w of words){if(hay.includes(w))sc+=w.length>2?2:1;else{sc-=1}}
    if(sc<=0)continue;const n0=norm(f[S.lang]||f.en);if(n0.startsWith(s))sc+=2;{const nw=norm(f.en).split(" ");if(words.every(w=>nw.includes(w))&&nw.length<=words.length+1)sc+=3}if(norm(f.en)===s)sc+=6;if(f.src==="annam")sc+=2.5;if(f.src==="my"||f.src==="off")sc+=3;if(f.src==="ifct"&&/raw/.test(f.en)&&!/raw/.test(s))sc-=1;sc-=norm(f.en).length/60;

  return{kcal:k,p:Math.round(Math.max(p.w*1.1,k*.2/4)),c:Math.round(k*.5/4),f:Math.round(k*.28/9),fi:p.sex==="f"?25:30}}

function makeMyFood(o){const g=Math.max(1,+o.g||100),k=100/g;

    units:[...(o.unit&&o.unit!=="100 g"?[{l:o.unit,g}]:[]),{l:"100 g",g:100}],unit:"1 "+(o.unit||"100 g"),kcal:Math.round(+o.kcal||0),p:+o.p||0}}

/* ---------- Barcode scan: Open Food Facts (free, open database) ---------- */
async function lookupBarcode(code){
  const known=Object.values(S.myfoods).find(f=>f.barcode===code);if(known)return known;
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,brands,nutriments,serving_quantity,serving_size`);
  if(r.status===404)return null;if(!r.ok)throw new Error("net");const d=await r.json();if(d.status!==1||!d.product)return null;
  const p=d.product,n=p.nutriments||{},v=k=>+n[k+"_100g"]||0;
  let kcal=v("energy-kcal");if(!kcal&&v("energy"))kcal=v("energy")/4.184;if(!kcal)return null;
  const sq=+p.serving_quantity>0?+p.serving_quantity:0;
  const f=makeMyFood({id:"off_"+code,src:"off",barcode:code,name:(p.product_name_en||p.product_name||code).trim(),brand:p.brands||"",
    unit:sq?"serving":"100 g",g:sq||100,kcal:kcal*(sq||100)/100,p:v("proteins")*(sq||100)/100,c:v("carbohydrates")*(sq||100)/100,f:v("fat")*(sq||100)/100,fi:v("fiber")*(sq||100)/100,
    mi:[v("sugars"),v("saturated-fat"),v("cholesterol")*1000,v("calcium")*1000,v("iron")*1000,v("magnesium")*1000,v("potassium")*1000,v("sodium")*1000,v("zinc")*1000,v("vitamin-c")*1000,v("folates")*1e6,v("vitamin-a")*1e6]});
  if(p.brands)f.en=`${f.en} (${p.brands.split(",")[0].trim()})`;return f}
let scanStream=null;
function stopScan(){if(scanStream){scanStream.getTracks().forEach(x=>x.stop());scanStream=null}}
function openScan(meal){
  const canCam=("BarcodeDetector" in window)&&navigator.mediaDevices?.getUserMedia;
  sheet(`<div class="row"><h2 style="flex:1">${t("scan")}</h2><button class="chip-btn" id="sx">${t("cancel")}</button></div>
   ${canCam?`<video id="scanV" playsinline muted style="width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover"></video><div class="small muted">${t("scanHelp")}</div>`:`<div class="note">${t("noCamera")}</div>`}
   <form class="ask" id="codeF"><input id="codeI" inputmode="numeric" pattern="[0-9]*" placeholder="${t("typeCode")}" autocomplete="off"><button>${t("find")}</button></form>
   <div id="scanMsg"></div>`);
  const done=()=>{stopScan();closeSheet()};$("#sx").onclick=done;$(".scrim").onclick=done;
  let busyScan=false;
  const go=async code=>{code=String(code).replace(/\D/g,"");if(code.length<6||busyScan)return;busyScan=true;stopScan();
    $("#scanMsg").innerHTML=`<div class="pick"><div class="small muted">${t("looking")} ${code}</div><div class="bar"><i class="loading"></i></div></div>`;
    let f;try{f=await lookupBarcode(code)}catch(e){$("#scanMsg").innerHTML=`<div class="note">${t("netFail")}</div>`;busyScan=false;return}
    if(!f){$("#scanMsg").innerHTML=`<div class="note">${t("notFound")}</div><button class="btn" id="asMy">＋ ${t("newFood")}</button>`;
      $("#asMy").onclick=()=>openMyFood(meal,{barcode:code});busyScan=false;return}
    saveMyFood(f);openAdd.pickNow=f;openAdd(meal)};
  $("#codeF").onsubmit=e=>{e.preventDefault();go($("#codeI").value)};
  if(canCam){navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(async st=>{scanStream=st;const vd=$("#scanV");if(!vd){stopScan();return}
      vd.srcObject=st;await vd.play().catch(()=>{});const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
      const tick=async()=>{if(!scanStream||!$("#scanV"))return;try{const r=await det.detect(vd);if(r[0]?.rawValue){go(r[0].rawValue);return}}catch(e){}setTimeout(tick,250)};tick()})
    .catch(()=>{const vd=$("#scanV");if(vd)vd.outerHTML=`<div class="note">${t("noCamera")}</div>`})}
}

const OIL_OPTS=[{k:"less",g:null},{k:"normal",g:0},{k:"extra",g:7},{k:"lots",g:21}];
function aiItemModel(it){
  // best database match for the dish the AI saw
  let cands=[];for(const q of [it.name,...(it.search||[])]){for(const f of searchFoods(q,3))if(!cands.includes(f))cands.push(f)}
  cands=cands.slice(0,4);
  const good=cands.length&&[it.name,...(it.search||[])].some(q=>wordHit(cands[0],q));
  const aiFood={id:"ai",en:it.name,ta:it.local||it.name,hi:it.local||it.name,src:"ai",
    per:{kcal:+it.per100?.kcal||0,p:+it.per100?.protein||0,c:+it.per100?.carbs||0,f:+it.per100?.fat||0,fi:+it.per100?.fibre||0}};
  const grams=Math.max(5,+it.grams||100),count=it.countable&&+it.count>0?Math.round(+it.count):null;
  const oilDefault={none:"normal",little:"normal",normal:"normal",lots:"extra"}[it.oil]||"normal";
  return{it,cands,aiFood,pick:good?0:-1,count,unitG:count?grams/count:null,grams,size:"m",oil:oilDefault,on:true}}
function aiCalc(m){const f=m.pick>=0?m.cands[m.pick]:m.aiFood;
  let g=m.count!=null?m.unitG*m.count:m.grams*({s:.6,m:1,l:1.5}[m.size]);
  const n=nutr(f,g);const o=OIL_OPTS.find(x=>x.k===m.oil);
  if(o.g===null){const cut=n.f*.5;n.f=+(n.f-cut).toFixed(1);n.kcal=Math.round(n.kcal-cut*9)}
  else if(o.g){n.f=+(n.f+o.g).toFixed(1);n.kcal+=Math.round(o.g*9)}
  return{f,g:Math.round(g),n}}
async function aiAnalyze(aiPhoto,thumb,getMeal,used){

        ${it.cooked!==false?`<div class="q"><span>${t("oilQ")}</span><div class="seg">${OIL_OPTS.map(o=>chip("oil",o.k,m.oil,t("oil_"+o.k))).join("")}</div></div>`:""}
        <div class="mac num small"><span style="--c:var(--protein)">P ${r0(n.p)}g</span><span style="--c:var(--carbs)">C ${r0(n.c)}g</span><span style="--c:var(--fat)">F ${r0(n.f)}g</span><span style="--c:var(--fibre)">Fi ${r0(n.fi)}g</span><span class="muted">${g} g · ${f.src==="ai"?t("srcAi"):f.src==="indb"?"INDB":"Annam"}</span></div>`:""}
      </div>`}).join("");
    $("#aiBox").innerHTML=`<div class="pick"><div class="small">${t("aiFoundQ")}</div>${cards}
      ${res.note?`<div class="small muted">💡 ${esc(res.note)}</div>`:""}
      <button class="btn" id="aiAdd">${t("addSelected")} · <span class="num">${tot}</span> ${t("kcal")}</button><div class="note">${t("aiNote")}</div></div>`;
    document.querySelectorAll(".ai-item").forEach(el=>{const m=M[+el.dataset.i];
      el.querySelector("[data-on]").onchange=e=>{m.on=e.target.checked;draw()};

   <div class="grid2"><button class="btn ghost" id="bexp">⬇ ${t("exportB")}</button><button class="btn ghost" id="bimp">⬆ ${t("importB")}</button></div>
   <input type="file" id="bfile" accept="application/json,.json" hidden>`);
  $("#bexp").onclick=()=>{const blob=new Blob([JSON.stringify({app:"annam",v:2,saved:new Date().toISOString(),data:S})],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`annam-backup-${todayKey()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
  let pending=null;
  $("#bimp").onclick=()=>{if(pending){S=pending;S.favs=S.favs||[];S.myfoods=S.myfoods||{};S.weights=S.weights||{};Object.values(S.myfoods).forEach(f=>{if(!FOOD[f.id])addFood(f)});save();closeSheet();render();toast(t("restored"));return}$("#bfile").click()};
  $("#bfile").onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const d=j.app==="annam"?j.data:null;
      if(!d||typeof d.logs!=="object"||!d.profile)throw 0;pending=d;$("#bimp").textContent=t("restoreSure");$("#bimp").classList.remove("ghost")}catch(_){toast(t("badFile"))}};rd.readAsText(file)};
  let aim=p.aim;
  const read=()=>({name:$("#pn").value.trim(),age:+$("#pa").value||30,sex:$("#ps").value,h:+$("#ph").value||165,w:+$("#pw").value||65,act:+$("#pact").value,aim,goalW:+$("#pgw").value||null});
  const prev=()=>{const old=S.profile;S.profile=read();const g=goals();S.profile=old;$("#goalPrev").innerHTML=`${t("yourGoal")}: <b class="num">${g.kcal} ${t("kcal")}</b> · ${t("protein")} ${g.p}g · ${t("carbs")} ${g.c}g · ${t("fat")} ${g.f}g`};
  document.querySelectorAll(".sheet input,.sheet select").forEach(i=>i.oninput=prev);
  $("#aimSeg").onclick=e=>{const a=e.target.dataset.a;if(!a)return;aim=a;document.querySelectorAll("#aimSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.a===a));prev()};
  $("#psave").onclick=()=>{S.profile=read();save();closeSheet();render();toast(t("saved"))};prev();
}

/* ---------- Report ---------- */
function week(){return Array.from({length:7},(_,i)=>{const d=daysAgo(6-i),k=dk(d);return{d,k,...totals(k),n:(S.logs[k]||[]).length}})}
function viewReport(){
  const g=goals(),W=week(),logged=W.filter(x=>x.n),N=logged.length||1;
  const avg=k=>logged.reduce((a,x)=>a+x[k],0)/N;
  const onT=logged.filter(x=>Math.abs(x.kcal-g.kcal)<=g.kcal*.1).length;
  const max=Math.max(g.kcal*1.25,...W.map(x=>x.kcal));const H=170,top=14,bw=30,gap=(320-40-7*bw)/6;
  const y=v=>top+H-(v/max)*H;
  const loc=S.lang==="ta"?"ta-IN":S.lang==="hi"?"hi-IN":"en-IN";
  const ticks=[0,Math.round(max/2/100)*100,Math.floor(max/100)*100];
  const bars=W.map((x,i)=>{const X=40+i*(bw+gap),over=x.kcal>g.kcal*1.1;
    return `<rect x="${X}" y="${y(x.kcal)}" width="${bw}" height="${top+H-y(x.kcal)}" rx="6" fill="${over?"var(--over)":"var(--brand)"}" opacity="${i===6?1:.8}"/>
     <text x="${X+bw/2}" y="${top+H+16}" text-anchor="middle">${x.d.toLocaleDateString(loc,{weekday:"narrow"})}</text>
     ${x.kcal?`<text x="${X+bw/2}" y="${y(x.kcal)-4}" text-anchor="middle" style="font-size:9.5px">${x.kcal}</text>`:""}`}).join("");
  const ac=avg("c")*4,ap=avg("p")*4,af=avg("f")*9,sum=ac+ap+af||1;
  const ins=[];
  const pAvg=avg("p");
  if(pAvg<g.p*.8)ins.push(["var(--protein)",{en:`Protein is low: about ${r0(pAvg)} g a day against ${g.p} g. Add dal, curd, eggs, paneer or sprouts.`,ta:`புரதம் குறைவு: தினமும் சுமார் ${r0(pAvg)} கி, தேவை ${g.p} கி. பருப்பு, தயிர், முட்டை, பனீர் சேருங்கள்.`,hi:`प्रोटीन कम है: रोज़ लगभग ${r0(pAvg)} ग्राम, ज़रूरत ${g.p} ग्राम। दाल, दही, अंडा, पनीर जोड़ें।`}]);
  else ins.push(["var(--good)",{en:`Good protein: about ${r0(pAvg)} g a day.`,ta:`நல்ல புரதம்: தினமும் சுமார் ${r0(pAvg)} கி.`,hi:`अच्छा प्रोटीन: रोज़ लगभग ${r0(pAvg)} ग्राम।`}]);
  const fiAvg=avg("fi");
  if(fiAvg<g.fi*.8)ins.push(["var(--fibre)",{en:`Fibre averages ${r0(fiAvg)} g. Aim for ${g.fi} g with fruit, salad, ragi and sundal.`,ta:`நார்ச்சத்து சராசரி ${r0(fiAvg)} கி. பழம், சாலட், ராகி மூலம் ${g.fi} கி அடையுங்கள்.`,hi:`फाइबर औसत ${r0(fiAvg)} ग्राम है। फल, सलाद, रागी से ${g.fi} ग्राम तक पहुँचें।`}]);
  const carbPct=r0(ac/sum*100);
  if(carbPct>60)ins.push(["var(--carbs)",{en:`${carbPct}% of calories came from carbs. Try half the rice and more vegetables.`,ta:`${carbPct}% கலோரிகள் மாவுச்சத்திலிருந்து. சாதத்தை பாதியாக்கி காய்கறி கூட்டுங்கள்.`,hi:`${carbPct}% कैलोरी कार्ब्स से आई। आधा चावल और ज़्यादा सब्ज़ी लें।`}]);
  const big=[...W].sort((a,b)=>b.kcal-a.kcal)[0];
  if(big.kcal>g.kcal*1.1)ins.push(["var(--over)",{en:`Highest day: ${big.d.toLocaleDateString(loc,{weekday:"long"})} at ${big.kcal} kcal.`,ta:`அதிகமான நாள்: ${big.d.toLocaleDateString(loc,{weekday:"long"})} — ${big.kcal} கலோரி.`,hi:`सबसे ज़्यादा: ${big.d.toLocaleDateString(loc,{weekday:"long"})}, ${big.kcal} कैलोरी।`}]);
  // vitamins and minerals: average of logged days
  const G=microGoals();const MT=logged.map(x=>microTotals(x.k));const mAvg=G.map(x=>MT.reduce((a,z)=>a+z.m[x.i],0)/N);
  const covAvg=MT.length?MT.reduce((a,z)=>a+z.cov,0)/MT.length:0;
  const mv=k=>mAvg[G.findIndex(x=>x.k===k)],mg=k=>G.find(x=>x.k===k).g;
  if(logged.length&&covAvg>.5){
    if(mv("iron")<mg("iron")*.7)ins.push(["var(--over)",{en:`Iron is low: about ${r0(mv("iron"))} mg a day of ${mg("iron")} mg. Eat keerai (greens), ragi, chana, dates, jaggery, eggs or meat. Lemon or amla with the meal helps absorb it.`,ta:`இரும்புச்சத்து குறைவு: தினமும் சுமார் ${r0(mv("iron"))} மி.கி, தேவை ${mg("iron")} மி.கி. கீரை, ராகி, கொண்டைக்கடலை, பேரீச்சை, வெல்லம், முட்டை சாப்பிடுங்கள். உணவுடன் எலுமிச்சை அல்லது நெல்லி உதவும்.`,hi:`आयरन कम है: रोज़ लगभग ${r0(mv("iron"))} मि.ग्रा., ज़रूरत ${mg("iron")} मि.ग्रा.। साग, रागी, चना, खजूर, गुड़, अंडा या मांस लें। खाने के साथ नींबू या आंवला मदद करता है।`}]);
    if(mv("calcium")<mg("calcium")*.7)ins.push(["var(--protein)",{en:`Calcium is low: about ${r0(mv("calcium"))} mg a day of ${mg("calcium")} mg. Add curd, milk, buttermilk, ragi, paneer or sesame.`,ta:`கால்சியம் குறைவு: தினமும் சுமார் ${r0(mv("calcium"))} மி.கி, தேவை ${mg("calcium")} மி.கி. தயிர், பால், மோர், ராகி, பனீர், எள் சேருங்கள்.`,hi:`कैल्शियम कम है: रोज़ लगभग ${r0(mv("calcium"))} मि.ग्रा., ज़रूरत ${mg("calcium")} मि.ग्रा.। दही, दूध, छाछ, रागी, पनीर या तिल लें।`}]);
    if(mv("vitc")<mg("vitc")*.7)ins.push(["var(--good)",{en:`Vitamin C is low: about ${r0(mv("vitc"))} mg a day of ${mg("vitc")} mg. One guava, orange or amla a day is enough.`,ta:`வைட்டமின் C குறைவு: தினமும் சுமார் ${r0(mv("vitc"))} மி.கி, தேவை ${mg("vitc")} மி.கி. தினமும் ஒரு கொய்யா, ஆரஞ்சு அல்லது நெல்லிக்காய் போதும்.`,hi:`विटामिन C कम है: रोज़ लगभग ${r0(mv("vitc"))} मि.ग्रा., ज़रूरत ${mg("vitc")} मि.ग्रा.। रोज़ एक अमरूद, संतरा या आंवला काफ़ी है।`}]);
    if(mv("na")>mg("na"))ins.push(["var(--over)",{en:`Salt is high: about ${r0(mv("na"))} mg sodium a day (limit ${mg("na")}). Go easy on pickles, papad, chips and extra salt.`,ta:`உப்பு அதிகம்: தினமும் சுமார் ${r0(mv("na"))} மி.கி சோடியம் (வரம்பு ${mg("na")}). ஊறுகாய், அப்பளம், சிப்ஸ், கூடுதல் உப்பைக் குறையுங்கள்.`,hi:`नमक ज़्यादा है: रोज़ लगभग ${r0(mv("na"))} मि.ग्रा. सोडियम (सीमा ${mg("na")})। अचार, पापड़, चिप्स और ऊपर से नमक कम करें।`}]);
    if(mv("sugar")>mg("sugar"))ins.push(["var(--carbs)",{en:`Sugar is high: about ${r0(mv("sugar"))} g a day (limit ${mg("sugar")} g). Less sugar in tea and coffee, and fewer sweets.`,ta:`சர்க்கரை அதிகம்: தினமும் சுமார் ${r0(mv("sugar"))} கி (வரம்பு ${mg("sugar")} கி). டீ, காபியில் சர்க்கரையும் இனிப்புகளும் குறையுங்கள்.`,hi:`शक्कर ज़्यादा है: रोज़ लगभग ${r0(mv("sugar"))} ग्राम (सीमा ${mg("sugar")} ग्राम)। चाय-कॉफ़ी में चीनी और मिठाई कम करें।`}]);
  }
  const microHtml=logged.length?`<section class="card"><h3>${t("micros")} · ${t("avgDay")}</h3><div class="macros">${G.map((x,j)=>{const v=mAvg[j],pct=Math.min(100,v/x.g*100),bad=x.lim&&v>x.g;
    return `<div class="macro"><div class="lbl"><b>${t(x.k)}</b><span class="num muted">${v<10?+v.toFixed(1):r0(v)} / ${x.g} ${x.u}${x.lim?` ${t("limit")}`:""}</span></div><div class="bar"><i style="width:${pct}%;background:${x.lim?(bad?"var(--over)":"var(--good)"):(pct>=80?"var(--good)":"var(--turmeric)")}"></i></div></div>`}).join("")}</div>
    <div class="small muted" style="margin-top:8px">${t("microNote").replace("{p}",r0(covAvg*100))}</div></section>`:"";
  $("#view").innerHTML=`
   <section class="card"><h2 style="font-size:22px">${t("thisWeek")}</h2>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><span>${t("avgDay")}</span><strong class="num">${r0(avg("kcal"))}</strong></div>
      <div class="kpi"><span>${t("onTarget")}</span><strong class="num">${onT}/7</strong></div>
      <div class="kpi"><span>${t("avgProtein")}</span><strong class="num">${r0(pAvg)}g</strong></div>
    </div>
    <div class="chart" style="margin-top:12px"><svg viewBox="0 0 320 ${top+H+24}" role="img" aria-label="Calories per day this week">
      ${ticks.map(v=>`<line x1="34" x2="320" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="30" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("")}
      ${bars}
      <line x1="34" x2="320" y1="${y(g.kcal)}" y2="${y(g.kcal)}" stroke="var(--turmeric)" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="318" y="${y(g.kcal)-5}" text-anchor="end" style="fill:var(--turmeric);font-weight:600">${t("goal")} ${g.kcal}</text>
    </svg></div></section>
   <section class="card"><h3>${t("split")}</h3>
    <div class="split"><i style="width:${ap/sum*100}%;background:var(--protein)"></i><i style="width:${ac/sum*100}%;background:var(--carbs)"></i><i style="width:${af/sum*100}%;background:var(--fat)"></i></div>
    <div class="legend"><span><i style="background:var(--protein)"></i>${t("protein")} ${r0(ap/sum*100)}%</span><span><i style="background:var(--carbs)"></i>${t("carbs")} ${carbPct}%</span><span><i style="background:var(--fat)"></i>${t("fat")} ${r0(af/sum*100)}%</span></div></section>
   <section class="card"><h3>${t("insights")}</h3>${ins.map(([c,m])=>`<div class="insight"><span class="dot" style="background:${c}"></span><span>${m[S.lang]||m.en}</span></div>`).join("")}</section>
   ${microHtml}${weightCard()}`;
  $("#wForm").onsubmit=e=>{e.preventDefault();const v=+$("#wIn").value;if(!(v>20&&v<300))return;S.weights[todayKey()]=v;S.profile.w=v;save();render();toast(t("saved"))};
}
function weightCard(){const E=Object.entries(S.weights).sort((a,b)=>a[0]<b[0]?-1:1).slice(-30);const gw=S.profile.goalW;
  let chart="";if(E.length>=2){const vals=E.map(x=>x[1]).concat(gw?[gw]:[]);const lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
    const X=i=>34+i*(280/(E.length-1)),Y=v=>12+(hi-v)/(hi-lo)*120;
    chart=`<div class="chart"><svg viewBox="0 0 320 160" role="img" aria-label="${t("weightT")}">
      ${[lo,(lo+hi)/2,hi].map(v=>`<line x1="34" x2="320" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="30" y="${Y(v)+4}" text-anchor="end">${+v.toFixed(1)}</text>`).join("")}
      ${gw?`<line x1="34" x2="320" y1="${Y(gw)}" y2="${Y(gw)}" stroke="var(--good)" stroke-width="2" stroke-dasharray="5 4"/><text x="318" y="${Y(gw)-5}" text-anchor="end" style="fill:var(--good);font-weight:600">${t("goal")} ${gw}</text>`:""}
      <polyline fill="none" stroke="var(--brand)" stroke-width="2.5" points="${E.map((x,i)=>`${X(i)},${Y(x[1])}`).join(" ")}"/>
      ${E.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="3.5" fill="var(--brand)"/>`).join("")}
      <text x="34" y="154">${E[0][0].slice(5)}</text><text x="318" y="154" text-anchor="end">${E[E.length-1][0].slice(5)}</text></svg></div>`}
  const last=E.length?E[E.length-1][1]:null,ch=E.length>=2?last-E[0][1]:null;
  return `<section class="card"><div class="meal-h"><h3>${t("weightT")}</h3>${last?`<span class="kc num">${last} kg</span>`:""}</div>
   ${E.length?`<div class="small muted num">${ch!=null?`${ch>0?"+":""}${ch.toFixed(1)} kg ${t("sinceStart")}`:""}${gw&&last?` · ${Math.abs(last-gw).toFixed(1)} kg ${t("toGoal")}`:""}</div>`:`<div class="small muted">${t("noW")}</div>`}
   ${chart}
   <form class="ask" id="wForm" style="margin-top:10px"><input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="${t("logW")}" value="${S.weights[todayKey()]||""}"><button>${t("save")}</button></form></section>`}

/* ---------- Helper (offline, rule based) ---------- */
function answer(q){
  const L=S.lang,g=goals(),tt=totals(todayKey()),pl=r0(g.p-tt.p),kl=g.kcal-tt.kcal;
  const s=q.toLowerCase();
  const pick=(o)=>o[L]||o.en;
  if(/protein|புரத|प्रोटीन/.test(s)){
    return pl>0?pick({en:`You have eaten ${r0(tt.p)} g protein today. ${pl} g is left.\nEasy ways to get it: 2 boiled eggs (12 g), 1 cup curd (6 g), 100 g paneer (18 g), 1 bowl dal (10 g), 100 g grilled chicken (31 g).`,
      ta:`இன்று ${r0(tt.p)} கி புரதம் சாப்பிட்டீர்கள். இன்னும் ${pl} கி வேண்டும்.\nஎளிய வழிகள்: 2 அவித்த முட்டை (12 கி), 1 கப் தயிர் (6 கி), 100 கி பனீர் (18 கி), 1 கிண்ணம் பருப்பு (10 கி), 100 கி சிக்கன் (31 கி).`,
      hi:`आज आपने ${r0(tt.p)} ग्राम प्रोटीन खाया। ${pl} ग्राम बाकी है।\nआसान तरीके: 2 उबले अंडे (12 ग्राम), 1 कप दही (6 ग्राम), 100 ग्राम पनीर (18 ग्राम), 1 कटोरी दाल (10 ग्राम), 100 ग्राम चिकन (31 ग्राम)।`})
     :pick({en:`Great! You reached your protein goal of ${g.p} g today.`,ta:`அருமை! இன்றைய ${g.p} கி புரத இலக்கை அடைந்துவிட்டீர்கள்.`,hi:`बहुत बढ़िया! आज आपने ${g.p} ग्राम प्रोटीन का लक्ष्य पूरा किया।`});
  }
  if(/dinner|eat|இரவு|சாப்பிட|रात|खाऊ|खाना/.test(s)){
    const opts=RECIPES.filter(r=>r.kcal<=Math.max(kl,250)).sort((a,b)=>b.p-a.p).slice(0,3);
    const lines=opts.map(r=>`• ${r[L]||r.en}: ${r.kcal} ${t("kcal")}, ${t("protein")} ${r.p}g`).join("\n");
    return pick({en:`You have ${Math.max(kl,0)} kcal left today. Good choices:\n${lines}\nSee them in Recipes.`,
      ta:`இன்று இன்னும் ${Math.max(kl,0)} கலோரி மீதம் உள்ளது. நல்ல தேர்வுகள்:\n${lines}\nசமையல் பகுதியில் பாருங்கள்.`,
      hi:`आज ${Math.max(kl,0)} कैलोरी बाकी है। अच्छे विकल्प:\n${lines}\nरेसिपी में देखें।`});
  }
  if(/week|வாரம்|हफ़्त|हफ्त/.test(s)){
    const W=week().filter(x=>x.n),a=W.length?r0(W.reduce((s,x)=>s+x.kcal,0)/W.length):0,on=W.filter(x=>Math.abs(x.kcal-g.kcal)<=g.kcal*.1).length;
    return pick({en:`You logged food on ${W.length} of 7 days. Average ${a} kcal a day, goal ${g.kcal}. ${on} days were close to your goal. Open Report for the full picture.`,
      ta:`7 நாட்களில் ${W.length} நாட்கள் பதிவு செய்தீர்கள். தினசரி சராசரி ${a} கலோரி, இலக்கு ${g.kcal}. ${on} நாட்கள் இலக்கை ஒட்டி இருந்தன.`,
      hi:`7 में से ${W.length} दिन आपने खाना दर्ज किया। रोज़ औसत ${a} कैलोरी, लक्ष्य ${g.kcal}। ${on} दिन लक्ष्य के करीब रहे।`});
  }
  if(/lose|weight|tip|எடை|குறிப்பு|वज़न|वजन|टिप/.test(s)){
    return pick({en:"1. Fill half your plate with vegetables or salad.\n2. Eat protein at every meal: dal, curd, eggs, paneer, fish.\n3. Swap one rice meal for ragi or millets.\n4. Drink 8 glasses of water.\n5. Walk 20 minutes after dinner.\n6. Keep tea and coffee to 2 cups with less sugar.",
      ta:"1. தட்டின் பாதியை காய்கறி அல்லது சாலட்டால் நிரப்புங்கள்.\n2. ஒவ்வொரு வேளையும் புரதம்: பருப்பு, தயிர், முட்டை, பனீர், மீன்.\n3. ஒரு வேளை சாதத்திற்கு பதில் ராகி அல்லது சிறுதானியம்.\n4. 8 டம்ளர் தண்ணீர் குடியுங்கள்.\n5. இரவு உணவுக்குப் பின் 20 நிமிடம் நடங்கள்.\n6. டீ, காபி 2 கப், குறைந்த சர்க்கரை.",
      hi:"1. आधी थाली सब्ज़ी या सलाद से भरें।\n2. हर खाने में प्रोटीन लें: दाल, दही, अंडा, पनीर, मछली।\n3. एक बार चावल की जगह रागी या मिलेट लें।\n4. 8 गिलास पानी पिएँ।\n5. रात के खाने के बाद 20 मिनट टहलें।\n6. चाय-कॉफ़ी 2 कप तक, कम चीनी के साथ।"});
  }
  const f=FOODS.find(f=>[f.en,f.ta,f.hi,f.id].some(x=>s.includes(x.toLowerCase())));
  if(f)return `${fname(f)} (${f.unit}): ${f.kcal} ${t("kcal")} · ${t("protein")} ${f.p}g · ${t("carbs")} ${f.c}g · ${t("fat")} ${f.f}g · ${t("fibre")} ${f.fi}g`;
  return pick({en:`Today: ${tt.kcal} of ${g.kcal} kcal eaten, ${r0(tt.p)} g protein. Ask me about protein, dinner ideas, your week, weight-loss tips, or any food like "idli" or "paneer".`,
    ta:`இன்று: ${g.kcal} இல் ${tt.kcal} கலோரி, புரதம் ${r0(tt.p)} கி. புரதம், இரவு உணவு, வாரம், எடை குறைப்பு அல்லது "இட்லி" போன்ற உணவு பற்றி கேளுங்கள்.`,
    hi:`आज: ${g.kcal} में से ${tt.kcal} कैलोरी, प्रोटीन ${r0(tt.p)} ग्राम। प्रोटीन, रात का खाना, हफ़्ता, वज़न घटाना या "इडली" जैसे किसी खाने के बारे में पूछें।`});
}
let busy=false;
function aiContext(){const g=goals(),k=todayKey(),tt=totals(k),p=S.profile;
  return{goal:g,today:{kcal:tt.kcal,protein:r0(tt.p),carbs:r0(tt.c),fat:r0(tt.f),fibre:r0(tt.fi),
    foods:(S.logs[k]||[]).map(e=>({meal:e.meal,food:foodOf(e).en,qty:e.qty,kcal:e.kcal}))},
    micros_today:(()=>{const {m,cov}=microTotals(k);const o={coverage_pct:r0(cov*100)};microGoals().forEach(x=>o[x.k]=`${+m[x.i].toFixed(1)} of ${x.g} ${x.u}${x.lim?" limit":""}`);return o})(),
    week:week().map(x=>({day:x.k,kcal:x.kcal,protein:r0(x.p)})),profile:{age:p.age,sex:p.sex,heightCm:p.h,weightKg:p.w,aim:p.aim},water:S.water[k]||0,time:new Date().toTimeString().slice(0,5)}}
function viewCoach(){
  $("#view").innerHTML=`<div class="chat" id="chat"><div class="msg bot">${esc(t("helperHi"))}</div>
   ${chat.map(m=>`<div class="msg ${m.me?"me":"bot"}">${esc(m.text)}</div>`).join("")}</div>
   <div class="quick">${["q1","q2","q3","q4"].map(q=>`<button data-q="${q}">${t(q)}</button>`).join("")}</div>
   <form class="ask" id="askF"><input id="askI" placeholder="${t("askPh")}" autocomplete="off"><button>${t("send")}</button></form>
   <div class="note">${t(AI_URL?"aiHelperNote":"helperNote")}</div>`;
  const ask=async q=>{if(!q.trim()||busy)return;chat.push({me:1,text:q});
    if(!AI_URL){chat.push({me:0,text:answer(q)});viewCoach();window.scrollTo({top:document.body.scrollHeight});return}
    busy=true;chat.push({me:0,text:t("thinking")});viewCoach();window.scrollTo({top:document.body.scrollHeight});
    const history=chat.slice(0,-2).filter(m=>m.text!==t("thinking")).slice(-8).map(m=>({role:m.me?"user":"helper",text:m.text.slice(0,600)}));
    const refs=[];for(const w of norm(q).split(" ").filter(w=>w.length>=3)){const f=searchFoods(w,1)[0];if(f&&f.units&&wordHit(f,w)&&!refs.includes(f))refs.push(f)}
    const reference_foods=refs.slice(0,6).map(f=>{const u=f.units[0];const n=nutr(f,u.g);return{food:f.en,serving:`1 ${u.l} (${u.g} g)`,kcal:n.kcal,protein:n.p,carbs:n.c,fat:n.f,fibre:n.fi}});
    let a;try{a=(await aiPost("/chat",{question:q,lang:S.lang,context:aiContext(),history,reference_foods})).answer}catch(e){a=/busy/i.test(String(e.message))?t("aiBusy"):null}
    chat[chat.length-1].text=a||answer(q);busy=false;if(tab==="coach"){viewCoach();window.scrollTo({top:document.body.scrollHeight})}};
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>ask(t(b.dataset.q)));
  $("#askF").onsubmit=e=>{e.preventDefault();ask($("#askI").value)};
}

/* ---------- Recipes ---------- */
function viewRecipes(){
  const F={all:()=>1,hiProtein:r=>r.p>=15,lowCal:r=>r.kcal<300,veg:r=>r.veg};
  const R=RECIPES.filter(F[recFilter]);
  $("#view").innerHTML=`<div class="seg" id="rseg">${Object.keys(F).map(k=>`<button data-r="${k}" aria-pressed="${k===recFilter}">${t(k)}</button>`).join("")}</div>
   <div class="rgrid">${R.map(r=>`<article class="recipe"><button class="recipe-top" data-open="${r.id}" aria-expanded="${openRecipe===r.id}">
     <span class="plate" style="background:${r.col}">${r.kcal}</span>
     <span class="nm"><h3>${esc(r[S.lang]||r.en)}</h3><span class="tags"><span class="tag">${t("protein")} ${r.p}g</span><span class="tag">${t("fibre")} ${r.fi}g</span><span class="tag">${r.min} ${t("min")}</span><span class="tag">${t(r.meal)}</span></span></span></button>
     ${openRecipe===r.id?`<div class="recipe-body"><div class="small muted num">${r.kcal} ${t("kcal")} ${t("perServ")} · P ${r.p}g · C ${r.c}g · F ${r.f}g</div>
       <strong>${t("ingredients")}</strong><ul>${r.ing.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
       <strong>${t("steps")}</strong><ol>${r.st.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>
       <button class="btn" data-logr="${r.id}">${t("logThis")} · ${t(r.meal)}</button></div>`:""}</article>`).join("")}</div>`;
  $("#rseg").onclick=e=>{const k=e.target.dataset.r;if(!k)return;recFilter=k;viewRecipes()};
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{openRecipe=openRecipe===b.dataset.open?null:b.dataset.open;viewRecipes()});
  document.querySelectorAll("[data-logr]").forEach(b=>b.onclick=()=>{const r=RECIPES.find(x=>x.id===b.dataset.logr);const k=todayKey();
    (S.logs[k]=S.logs[k]||[]).push({id:Math.random().toString(36).slice(2),food:"__"+r.id,qty:1,meal:r.meal,kcal:r.kcal,p:r.p,c:r.c,f:r.f,fi:r.fi});save();toast(t("added")+": "+(r[S.lang]||r.en))});
}
/* recipes logged as food entries */
RECIPES.forEach(r=>{FOOD["__"+r.id]={id:"__"+r.id,en:r.en,ta:r.ta,hi:r.hi,unit:"1 serving",kcal:r.kcal,p:r.p,c:r.c,f:r.f,fi:r.fi}});

/* ---------- wiring ---------- */
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;window.scrollTo(0,0);render()});
$("#plusBtn").onclick=()=>openAdd();
$("#profileBtn").onclick=openProfile;
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;save();render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
if(location.hash.slice(1) in {today:1,report:1,coach:1,recipes:1})tab=location.hash.slice(1);
render();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
