<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Annam: a free calorie and nutrition tracker in English, Tamil and Hindi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Annam Calorie Tracker</title>
<meta name="theme-color" content="#3B2F8F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
<style>
/* Layout: phone-first single column app, sticky top bar, fixed bottom tab bar, sheets slide up from the bottom */
:root{
  --bg:#F5F4FA; --surface:#FFFFFF; --surface2:#EEECF7; --ink:#1E1A3A; --muted:#6B6785; --line:#E2DFEE;
  --brand:#3B2F8F; --brand-ink:#FFFFFF; --turmeric:#E8930C; --turmeric-soft:#FDF0DA;
  --protein:#D8456B; --carbs:#E8930C; --fat:#7A5AF8; --fibre:#2E9C8A; --over:#C8372D; --good:#2E8A55;
  --shadow:0 1px 2px rgba(30,26,58,.06),0 6px 20px rgba(30,26,58,.06);
  --display:"Baloo 2","Noto Sans Tamil","Noto Sans Devanagari",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans Tamil","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13111F; --surface:#1D1A2E; --surface2:#262239; --ink:#F1EFFA; --muted:#A39FBD; --line:#322D4A;
  --brand:#8E83F0; --brand-ink:#13111F; --turmeric:#F2A93B; --turmeric-soft:#3A2D16;
  --protein:#F0708F; --carbs:#F2A93B; --fat:#A08BFF; --fibre:#4FC2AE; --over:#F06A5E; --good:#5CC98A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#13111F; --surface:#1D1A2E; --surface2:#262239; --ink:#F1EFFA; --muted:#A39FBD; --line:#322D4A;
  --brand:#8E83F0; --brand-ink:#13111F; --turmeric:#F2A93B; --turmeric-soft:#3A2D16;
  --protein:#F0708F; --carbs:#F2A93B; --fat:#A08BFF; --fibre:#4FC2AE; --over:#F06A5E; --good:#5CC98A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--turmeric);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo-mark{width:32px;height:32px;border-radius:10px;background:var(--turmeric);display:grid;place-items:center;flex:none}
.logo h1{font-size:24px;font-weight:800;letter-spacing:.2px}
.logo small{display:block;font-size:12px;opacity:.8;font-family:var(--body);font-weight:400}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:inherit;padding:4px 9px;border-radius:999px;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand);font-weight:600}
.icon-btn{border:0;background:rgba(255,255,255,.14);color:inherit;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}

main{max-width:560px;margin:0 auto;padding-block:14px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
main>*{min-width:0}
#exT{flex:1.4;min-width:0;width:0;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--surface);color:var(--ink)}
#exM{width:0}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

.banner{background:var(--turmeric-soft);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13px}
.banner b{font-weight:600}
.banner button{margin-left:auto;flex:none;border:1px solid var(--turmeric);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px}

.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c strong{font-family:var(--display);font-size:30px;line-height:1}
.ring-c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat strong{font-family:var(--display);font-size:20px}
.macros{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:16px}
.macro .lbl{display:flex;justify-content:space-between;font-size:13px}
.macro .lbl b{font-weight:600}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}

.meal{display:grid;gap:8px}
.meal-h{display:flex;align-items:center;gap:10px}
.meal-h h3{font-size:18px;flex:1}
.meal-h .kc{font-size:13px;color:var(--muted)}
.chip-btn{border:0;background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip-btn.primary{background:var(--brand);color:var(--brand-ink)}
.entry{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.entry img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.entry .nm{flex:1;min-width:0}
.entry .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .nm small{color:var(--muted);font-size:12px}
.entry .kc{font-weight:600;font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:50%}
.empty{font-size:13px;color:var(--muted);padding:4px 0}

.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.glass{width:30px;height:38px;border:2px solid var(--fibre);border-radius:4px 4px 9px 9px;background:transparent;padding:0;position:relative;overflow:hidden}
.glass.on::after{content:"";position:absolute;inset:35% 0 0;background:var(--fibre);opacity:.7}

.snaps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.snaps img{width:78px;height:78px;border-radius:12px;object-fit:cover;flex:none}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:8px 2px 10px;font-size:11.5px;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--brand);font-weight:600}
.nav .plus{transform:translateY(-14px)}
.nav .plus span.o{width:56px;height:56px;border-radius:18px;background:var(--turmeric);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(232,147,12,.4)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,12,30,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;
  padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-size:22px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.food .nm{flex:1;min-width:0}
.food .nm small{display:block;color:var(--muted);font-size:12px}
.food .add{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;font-size:18px;color:var(--brand)}
.pick{background:var(--surface2);border-radius:16px;padding:12px;display:grid;gap:10px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);font-size:20px}
.stepper output{min-width:44px;text-align:center;font-weight:600}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--brand);color:var(--brand-ink);width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.photo-prev{width:100%;max-height:220px;object-fit:cover;border-radius:14px}
.daynav{display:flex;align-items:center;gap:8px;margin:0 0 10px}.daynav strong{flex:1;text-align:center;font-family:var(--display);font-size:17px}.daynav .chip-btn{min-width:40px;justify-content:center;font-size:18px}.chip-btn:disabled,.btn:disabled{opacity:.45}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 10px}

/* report */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface2);border-radius:14px;padding:10px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi strong{font-family:var(--display);font-size:20px}
.insight{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.split i{display:block;height:100%}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* coach */
.chat{display:grid;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14.5px;white-space:pre-line}
.msg.bot{background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.msg.me{background:var(--brand);color:var(--brand-ink);justify-self:end;border-bottom-right-radius:4px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.quick button{flex:none;border:1px solid var(--brand);color:var(--brand);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px}
.ask button{border:0;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 16px;font-weight:600}

/* recipes */
.rgrid{display:grid;gap:12px}
.recipe{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.recipe-top{display:flex;gap:12px;padding:14px;align-items:center;width:100%;text-align:left;border:0;background:transparent}
.plate{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:20px}
.recipe-top .nm{flex:1;min-width:0}
.recipe-top h3{font-size:17px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;border-radius:99px;padding:2px 8px;background:var(--surface2);color:var(--muted)}
.recipe-body{padding:0 14px 14px;display:grid;gap:8px;font-size:14px}
.recipe-body ol,.recipe-body ul{margin:0;padding-left:20px;display:grid;gap:4px}

.entry .nm{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.conf{font-size:11px;border-radius:99px;padding:1px 7px;font-weight:600;white-space:nowrap;vertical-align:middle}
.conf.high{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.conf.medium{background:var(--turmeric-soft);color:var(--turmeric)}
.conf.low{background:color-mix(in srgb,var(--over) 15%,transparent);color:var(--over)}
.ai-item{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ai-item.off{opacity:.55}
.q{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.q .seg button{padding:5px 10px}
.q select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:14px;max-width:100%}
.mac{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.mac span[style]{border-left:3px solid var(--c);padding-left:5px}
.kc-big{font-family:var(--display);font-size:20px}.kc-big small{font-size:12px;color:var(--muted);font-family:var(--body)}
.food .tag{font-size:10px}
.bar i.loading{width:35%;background:var(--brand);animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (max-width:380px){.hero{grid-template-columns:110px 1fr}.ring{width:110px;height:110px}.ring-c strong{font-size:24px}.lang button{padding:4px 7px}}
#sgT{flex:1.3;min-width:0;width:0;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--surface);color:var(--ink)}
#sgV{width:0}
.srch{position:relative}.srch input{padding-right:50px}
.mic{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);color:var(--brand);display:grid;place-items:center;padding:0}
.ask .mic{position:static;transform:none;flex:none;width:42px;height:42px;padding:0;background:var(--surface2);color:var(--brand)}
.mic.on,.ask .mic.on{background:var(--over);color:#fff}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--over) 25%,transparent)}}}
.tgl{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tgl:checked{background:var(--good)}.tgl:checked::after{transform:translateX(18px)}
.rem{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rem .nm{flex:1;min-width:0;font-size:14.5px;color:var(--ink)}
.rem input[type=time]{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 8px;font-size:14px;width:auto;min-width:0}
.cal{border:0;background:var(--surface2);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;text-decoration:none;color:var(--ink);flex:none;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .field input,.grid3 .field select{padding:8px 6px;font-size:14px}
.alert{background:color-mix(in srgb,var(--over) 13%,transparent);border-radius:14px;padding:10px 12px;font-size:13.5px}
.fring{position:relative;width:190px;height:190px;margin:4px auto 10px}.fring svg{width:100%;height:100%;transform:rotate(-90deg)}.fring .ring-c strong{font-size:38px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.days button{flex:1 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 5px;display:grid;justify-items:center;gap:1px;font-size:12px;color:var(--muted);min-width:44px}
.days button b{font-family:var(--display);font-size:18px;color:var(--ink);line-height:1.1}
.days button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.days button[aria-pressed="true"] b{color:var(--brand-ink)}
.optrow{display:grid;gap:8px}
.pl-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.pl-item .nm{flex:1;min-width:0}.pl-item small{display:block;color:var(--muted);font-size:12px}
.row-btns{display:flex;gap:8px;margin-top:6px}.row-btns>*{flex:1;justify-content:center}
.combo{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.combo .nm{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.combo .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.sg .v{font-family:var(--display);font-size:22px;min-width:52px}.sg .nm{flex:1;min-width:0}
.tag.sweet{background:color-mix(in srgb,var(--over) 14%,transparent);color:var(--over)}
.tag.fib{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.macro .lbl{flex-wrap:wrap;gap:0 6px}.macro .lbl span{white-space:nowrap;margin-left:auto}
@media (max-width:380px){.icon-btn{width:32px;height:32px}.top-in{gap:6px}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="logo">
    <div class="logo-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="15" rx="9" ry="4" fill="#fff"/><path d="M7 13c1-4 3-6 5-6s4 2 5 6" stroke="#3B2F8F" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="5" r="1.6" fill="#fff"/></svg></div>
    <div><h1 id="appName">Annam</h1><small id="dateLine"></small></div>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="ta">த</button><button data-lang="hi">हि</button>
  </div>
  <button class="icon-btn" id="remBtn" aria-label="Reminders"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></button>
  <button class="icon-btn" id="profileBtn" aria-label="Profile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
</div></header>

const vkey=w=>{if(w.length<3||!/^[a-z]+$/.test(w))return w;
  const x=w.replace(/([bcdgjkpt])h/g,"$1").replace(/ee/g,"i").replace(/oo/g,"u").replace(/w/g,"v").replace(/z/g,"j").replace(/q/g,"k").replace(/x/g,"ks").replace(/y/g,"i").replace(/(.)\1+/g,"$1");
  return x.length>=4&&x.endsWith("s")?x.slice(0,-1):x};

      else{if(N.V.has(v))b=2.6;
        // half-typed word: whole words that start with it (the last word counts most, as it is still being typed)
        for(let k=0;k<N.W.length;k++){const x=N.W[k],y=N.VW[k];if((x.length>w.length&&x.startsWith(w))||(!known[i]&&v.length>=3&&y.length>v.length&&y.startsWith(v))){

const STOP=new Set("the and for with can how much many what eat ate are you has have any not too its day was this that from into per one two big small more less good bad best better than which should will lunch dinner breakfast snack today".split(" "));

  if(r.status===404)return null;if(!r.ok)throw new Error("net");const d=await r.json();if(d.status!==1||!d.product)return null;
  const p=d.product,n=p.nutriments||{},v=k=>+n[k+"_100g"]||0;
  let kcal=v("energy-kcal");if(!kcal&&v("energy"))kcal=v("energy")/4.184;if(!kcal)return null;

const OIL_OPTS=[{k:"less",g:null},{k:"normal",g:0},{k:"extra",g:7},{k:"lots",g:21}];
function aiItemModel(it){
  // best database match for the dish the AI saw
  let cands=[];for(const q of [it.name,...(it.search||[])]){for(const f of searchFoods(q,3))if(!cands.includes(f))cands.push(f)}
  // a packet or raw ingredient (not cooked): dry / raw foods first
  if(it.cooked===false){const dry=f=>f.src==="ifct"||/\b(raw|dry|flour|atta|maavu)\b/i.test(f.en)?1:0;cands.sort((a,b)=>dry(b)-dry(a))}
  cands=cands.slice(0,4);
  const good=cands.length&&[it.name,...(it.search||[])].some(q=>wordHit(cands[0],q));
  const aiFood={id:"ai",en:it.name,ta:it.local||it.name,hi:it.local||it.name,src:"ai",
    per:{kcal:+it.per100?.kcal||0,p:+it.per100?.protein||0,c:+it.per100?.carbs||0,f:+it.per100?.fat||0,fi:+it.per100?.fibre||0}};
  const grams=Math.max(5,+it.grams||100),count=it.countable&&+it.count>0?Math.round(+it.count):null;
  const oilDefault={none:"normal",little:"normal",normal:"normal",lots:"extra"}[it.oil]||"normal";
  return{it,cands,aiFood,pick:good?0:-1,count,unitG:count?grams/count:null,grams,size:"m",oil:oilDefault,on:true}}
function aiCalc(m){const f=m.pick>=0?m.cands[m.pick]:m.aiFood;
  let g=m.count!=null?m.unitG*m.count:m.grams*({s:.6,m:1,l:1.5}[m.size]);
  const n=nutr(f,g);const o=OIL_OPTS.find(x=>x.k===m.oil);
  if(o.g===null){const cut=n.f*.5;n.f=+(n.f-cut).toFixed(1);n.kcal=Math.round(n.kcal-cut*9)}
  else if(o.g){n.f=+(n.f+o.g).toFixed(1);n.kcal+=Math.round(o.g*9)}

function week(){return Array.from({length:7},(_,i)=>{const d=daysAgo(6-i),k=dk(d);return{d,k,...totals(k),n:(S.logs[k]||[]).length}})}
function viewReport(){
  const g=goals(),W=week(),logged=W.filter(x=>x.n),N=logged.length||1;
  const avg=k=>logged.reduce((a,x)=>a+x[k],0)/N;
  const onT=logged.filter(x=>Math.abs(x.kcal-g.kcal)<=g.kcal*.1).length;
  const max=Math.max(g.kcal*1.25,...W.map(x=>x.kcal));const H=170,top=14,bw=30,gap=(320-40-7*bw)/6;
  const y=v=>top+H-(v/max)*H;
  const loc=S.lang==="ta"?"ta-IN":S.lang==="hi"?"hi-IN":"en-IN";
  const ticks=[0,Math.round(max/2/100)*100,Math.floor(max/100)*100];
  const bars=W.map((x,i)=>{const X=40+i*(bw+gap),over=x.kcal>g.kcal*1.1;

     <text x="${X+bw/2}" y="${top+H+16}" text-anchor="middle">${x.d.toLocaleDateString(loc,{weekday:"narrow"})}</text>
     ${x.kcal?`<text x="${X+bw/2}" y="${y(x.kcal)-4}" text-anchor="middle" style="font-size:9.5px">${x.kcal}</text>`:""}`}).join("");
  const ac=avg("c")*4,ap=avg("p")*4,af=avg("f")*9,sum=ac+ap+af||1;
  const ins=[];

  if(pAvg<g.p*.8)ins.push(["var(--protein)",{en:`Protein is low: about ${r0(pAvg)} g a day against ${g.p} g. Add dal, curd, eggs, paneer or sprouts.`,ta:`புரதம் குறைவு: தினமும் சுமார் ${r0(pAvg)} கி, தேவை ${g.p} கி. பருப்பு, தயிர், முட்டை, பனீர் சேருங்கள்.`,hi:`प्रोटीन कम है: रोज़ लगभग ${r0(pAvg)} ग्राम, ज़रूरत ${g.p} ग्राम। दाल, दही, अंडा, पनीर जोड़ें।`}]);
  else ins.push(["var(--good)",{en:`Good protein: about ${r0(pAvg)} g a day.`,ta:`நல்ல புரதம்: தினமும் சுமார் ${r0(pAvg)} கி.`,hi:`अच्छा प्रोटीन: रोज़ लगभग ${r0(pAvg)} ग्राम।`}]);
  const fiAvg=avg("fi");
  if(fiAvg<g.fi*.8)ins.push(["var(--fibre)",{en:`Fibre averages ${r0(fiAvg)} g. Aim for ${g.fi} g with fruit, salad, ragi and sundal.`,ta:`நார்ச்சத்து சராசரி ${r0(fiAvg)} கி. பழம், சாலட், ராகி மூலம் ${g.fi} கி அடையுங்கள்.`,hi:`फाइबर औसत ${r0(fiAvg)} ग्राम है। फल, सलाद, रागी से ${g.fi} ग्राम तक पहुँचें।`}]);
  const carbPct=r0(ac/sum*100);
  if(carbPct>60)ins.push(["var(--carbs)",{en:`${carbPct}% of calories came from carbs. Try half the rice and more vegetables.`,ta:`${carbPct}% கலோரிகள் மாவுச்சத்திலிருந்து. சாதத்தை பாதியாக்கி காய்கறி கூட்டுங்கள்.`,hi:`${carbPct}% कैलोरी कार्ब्स से आई। आधा चावल और ज़्यादा सब्ज़ी लें।`}]);
  const big=[...W].sort((a,b)=>b.kcal-a.kcal)[0];
  if(big.kcal>g.kcal*1.1)ins.push(["var(--over)",{en:`Highest day: ${big.d.toLocaleDateString(loc,{weekday:"long"})} at ${big.kcal} kcal.`,ta:`அதிகமான நாள்: ${big.d.toLocaleDateString(loc,{weekday:"long"})} — ${big.kcal} கலோரி.`,hi:`सबसे ज़्यादा: ${big.d.toLocaleDateString(loc,{weekday:"long"})}, ${big.kcal} कैलोरी।`}]);
  // vitamins and minerals: average of logged days
  const G=microGoals();const MT=logged.map(x=>microTotals(x.k));const mAvg=G.map(x=>MT.reduce((a,z)=>a+z.m[x.i],0)/N);
  const covAvg=MT.length?MT.reduce((a,z)=>a+z.cov,0)/MT.length:0;

  const s=q.toLowerCase();

      hi:`आज ${Math.max(kl,0)} कैलोरी बाकी है। अच्छे विकल्प:\n${lines}\nयोजना में देखें।`});

/* ---------- small helpers for plans, fasting, reminders, diabetes mode, voice, saved meals ---------- */
const p2=n=>String(n).padStart(2,"0");
const locale=()=>S.lang==="ta"?"ta-IN":S.lang==="hi"?"hi-IN":"en-IN";
const appName=()=>S.lang==="ta"?"அன்னம்":S.lang==="hi"?"अन्नम्":"Annam";
const appUrl=()=>location.origin+location.pathname.replace(/index\.html$/,"");
const frac=q=>{q=+q;const w=Math.floor(q),r=+(q-w).toFixed(2);const fr={.25:"¼",.5:"½",.75:"¾"}[r];return fr?(w?w:"")+fr:String(+q.toFixed(2))};
const clock=h=>{const m=Math.max(0,Math.floor(h*60));return `${Math.floor(m/60)}:${p2(m%60)}`};
const dur=h=>{const m=Math.max(0,Math.round(h*60));return `${Math.floor(m/60)} ${t("hShort")} ${p2(m%60)} ${t("mShort")}`};
const tmLabel=ms=>new Date(ms).toLocaleTimeString(locale(),{hour:"numeric",minute:"2-digit"});
const dayLabel=k=>k===todayKey()?t("today"):new Date(k+"T12:00").toLocaleDateString(locale(),{weekday:"short",day:"numeric",month:"short"});
const hhmm=ms=>{const d=new Date(ms);return p2(d.getHours())+":"+p2(d.getMinutes())};

/* ---------- alerts: in-app toast when open, phone notification through the service worker ---------- */
async function notify(title,body,hash,force){
  if(!document.hidden)toast(title);
  if(!document.hidden&&!force)return;
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  const opt={body,icon:"icons/icon-192.png",tag:"annam-"+hash,renotify:true,data:{hash}};
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg){await reg.showNotification(title,opt);return}}catch(e){}
  try{new Notification(title,opt)}catch(e){}}

/* ---------- reminders ---------- */
const BYDAY=["SU","MO","TU","WE","TH","FR","SA"];
const remTitle=k=>`${t(k==="water"?"n_water":k==="weight"?"n_weight":"n_"+k)} · ${appName()}`;
function waterSlots(W=S.rem.items.water){const [fh,fm]=(W.from||"09:00").split(":").map(Number),[th,tm]=(W.to||"21:00").split(":").map(Number);const out=[];
  for(let m=fh*60+fm;m<=th*60+tm&&out.length<18;m+=Math.max(1,+W.every||2)*60)out.push(p2(Math.floor(m/60))+":"+p2(m%60));return out}
function nextAt(time,wd){const [h,m]=String(time||"08:00").split(":").map(Number);const d=new Date();d.setHours(h,m,0,0);const now=new Date();
  if(wd!=null){let n=0;while((d.getDay()!==+wd||d<now)&&n++<9)d.setDate(d.getDate()+1)}else if(d<now)d.setDate(d.getDate()+1);return d}
const icsT=d=>`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`;
function gcalUrl(title,details,d,rrule){const e=new Date(d.getTime()+10*60000);let tz="Asia/Kolkata";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(_){}
  return "https://calendar.google.com/calendar/render?"+new URLSearchParams({action:"TEMPLATE",text:title,details,dates:`${icsT(d)}/${icsT(e)}`,ctz:tz,recur:"RRULE:"+rrule}).toString()}
const icsEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
function icsFold(line){const enc=new TextEncoder();if(enc.encode(line).length<=75)return line;const out=[];let cur="",n=0;
  for(const ch of line){const b=enc.encode(ch).length;if(n+b>75){out.push(cur);cur=" ";n=1}cur+=ch;n+=b}out.push(cur);return out.join("\r\n")}
function icsFile(I){const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Annam//Reminders//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");let n=0;
  const ev=(id,title,body,d,rrule)=>{n++;L.push("BEGIN:VEVENT",`UID:annam-${id}-${Date.now()}@annam`,`DTSTAMP:${stamp}`,`DTSTART:${icsT(d)}`,"DURATION:PT10M",`RRULE:${rrule}`,
    `SUMMARY:${icsEsc(title)}`,`DESCRIPTION:${icsEsc((body?body+" ":"")+appUrl())}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(title)}`,"TRIGGER:PT0M","END:VALARM","END:VEVENT")};
  MEALS.forEach(m=>{if(I[m].on)ev(m,remTitle(m),t("n_body"),nextAt(I[m].time),"FREQ=DAILY")});
  if(I.water.on)waterSlots(I.water).forEach(tm=>ev("water"+tm.replace(":",""),remTitle("water"),"",nextAt(tm),"FREQ=DAILY"));
  if(I.weight.on)ev("weight",remTitle("weight"),t("n_weightBody"),nextAt(I.weight.time,I.weight.day),"FREQ=WEEKLY;BYDAY="+BYDAY[+I.weight.day]);
  if(!n)return null;L.push("END:VCALENDAR");return L.map(icsFold).join("\r\n")+"\r\n"}
function remTick(){const R=S.rem;if(!R)return;const now=new Date(),k=todayKey(),cur=now.getHours()*60+now.getMinutes();
  for(const key of Object.keys(R.fired))if(!key.startsWith(k))delete R.fired[key];
  const due=tm=>{const [h,m]=String(tm).split(":").map(Number);const d=h*60+m;return cur>=d&&cur-d<=30};
  const fire=(slot,title,body,hash)=>{if(R.fired[slot])return;R.fired[slot]=1;save();notify(title,body,hash)};
  if(R.on){const I=R.items,L=S.logs[k]||[];
    MEALS.forEach(m=>{if(I[m].on&&due(I[m].time)&&!L.some(e=>e.meal===m))fire(k+"_"+m,t("n_"+m),t("n_body"),"today")});
    if(I.water.on&&(S.water[k]||0)<8)waterSlots(I.water).forEach(tm=>{if(due(tm))fire(k+"_w"+tm,t("n_water"),t("n_waterBody").replace("{n}",S.water[k]||0),"today")});
    if(I.weight.on&&now.getDay()===+I.weight.day&&due(I.weight.time)&&!S.weights[k])fire(k+"_wt",t("n_weight"),t("n_weightBody"),"report")}
  const st=fastNow();if(st&&st.done&&!S.fast.notified){S.fast.notified=true;save();notify(t("n_fast"),t("n_fastBody").replace("{h}",S.fast.plan),"fast")}
  fastLive()}
function openReminders(){const I=JSON.parse(JSON.stringify(S.rem.items));let on=!!S.rem.on;
  const perm=()=>!("Notification" in window)?"none":Notification.permission;

  sheet(`<div class="row"><h2 style="flex:1">🔔 ${t("reminders")}</h2><button class="chip-btn" id="sx">${t("cancel")}</button></div>

    <div>${MEALS.map(m=>`<div class="rem"><input type="checkbox" class="tgl" id="ro_${m}" ${I[m].on?"checked":""}><label class="nm" for="ro_${m}">${t(m)}</label><input type="time" id="rt_${m}" value="${I[m].time}" aria-label="${t("remTime")}">${cal(m)}</div>`).join("")}
    <div class="rem"><input type="checkbox" class="tgl" id="ro_water" ${I.water.on?"checked":""}><label class="nm" for="ro_water">💧 ${t("remWater")}</label></div>

     <div class="field"><label for="rw_from">${t("remStart")}</label><input type="time" id="rw_from" value="${I.water.from}"></div><div class="field"><label for="rw_to">${t("remEnd")}</label><input type="time" id="rw_to" value="${I.water.to}"></div></div>
    <div class="rem" style="margin-top:6px"><input type="checkbox" class="tgl" id="ro_weight" ${I.weight.on?"checked":""}><label class="nm" for="ro_weight">⚖ ${t("remWeight")}</label>${cal("weight")}</div>
    <div class="grid2"><div class="field"><label for="rg_day">${t("remDay")}</label><select id="rg_day">${days.map((d,i)=>`<option value="${i}" ${+I.weight.day===i?"selected":""}>${d}</option>`).join("")}</select></div><div class="field"><label for="rg_time">${t("remTime")}</label><input type="time" id="rg_time" value="${I.weight.time}"></div></div></div>

    $("#cal_weight").href=gcalUrl(remTitle("weight"),t("n_weightBody")+" "+appUrl(),nextAt(I.weight.time,I.weight.day),"FREQ=WEEKLY;BYDAY="+BYDAY[I.weight.day])};

/* ---------- fasting timer ---------- */
const FPLANS=[12,14,16,18,20];
function fastNow(){const F=S.fast;if(!F||!F.start)return null;const el=(Date.now()-F.start)/36e5;return{el,goal:F.plan,end:F.start+F.plan*36e5,done:el>=F.plan}}
const fastStage=h=>t(h<4?"st1":h<8?"st2":h<12?"st3":h<16?"st4":"st5");
function fRing(pct,done){const r=80,C=2*Math.PI*r;return `<svg viewBox="0 0 190 190" aria-hidden="true"><circle cx="95" cy="95" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="14"/>${pct>0?`<circle cx="95" cy="95" r="${r}" fill="none" stroke="${done?"var(--good)":"var(--brand)"}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}"/>`:""}</svg>`}
const fastLeftText=st=>st.done?t("goalReached"):`${dur(st.goal-st.el)} ${t("leftH")} · ${t("endsAt")} ${tmLabel(st.end)}${dk(st.end)!==todayKey()?` (${t("tomorrow")})`:""}`;
function fastLive(){const st=fastNow();if(!st)return;
  if($("#fEl")){$("#fEl").textContent=clock(st.el);const sv=$("#fRing svg");if(sv)sv.outerHTML=fRing(Math.min(1,st.el/st.goal),st.done);$("#fLeft").textContent=fastLeftText(st);$("#fStage").textContent=fastStage(st.el)}
  if($("#fastTxt"))$("#fastTxt").textContent=`${clock(st.el)} / ${st.goal} ${t("hShort")}`}
function startFast(at){const F=S.fast;F.start=at||Date.now();F.notified=false;save();toast(t("fastStarted"))}
function endFast(){const F=S.fast;if(!F.start)return;if((Date.now()-F.start)/36e5>=.25){F.hist.unshift({s:F.start,e:Date.now(),g:F.plan});F.hist=F.hist.slice(0,60)}
  F.start=null;F.notified=false;save();toast(t("fastEnded"))}
function atTime(v){if(!v)return null;const [h,m]=v.split(":").map(Number);const d=new Date();d.setHours(h,m,0,0);if(d.getTime()>Date.now()+6e4)d.setDate(d.getDate()-1);return d.getTime()}
function fastStreak(){const days=new Set(S.fast.hist.filter(h=>(h.e-h.s)/36e5>=h.g).map(h=>dk(h.e)));let n=0;for(let i=0;i<90;i++){if(days.has(dk(daysAgo(i))))n++;else if(i>0)break}return n}
function fastBanner(){const st=fastNow();if(!st)return"";const ate=(S.logs[todayKey()]||[]).some(e=>e.at&&e.at>S.fast.start&&e.kcal>=50);
  return `<div class="banner"><span>⏳ <b>${t("fastingNow")}</b> <span class="num" id="fastTxt">${clock(st.el)} / ${st.goal} ${t("hShort")}</span>${st.done?`<br>${t("goalReached")}`:ate?`<br>${t("fastFood")}`:""}</span>${st.done||ate?`<button id="fastEndB">${t("endFast")}</button>`:`<button id="fastOpenB">${t("open")}</button>`}</div>`}
function viewFast(seg){const F=S.fast,st=fastNow(),H=F.hist.slice(0,7),sk=fastStreak();
  const startBox=btn=>`<div class="field" style="margin-top:10px"><label for="fStartT">${t("startedAt")}</label><div class="ask"><input id="fStartT" type="time" value="${st?hhmm(F.start):""}"><button id="fStartSet">${btn}</button></div></div>`;
  const main=st?`<section class="card" style="text-align:center"><div class="fring" id="fRing">${fRing(Math.min(1,st.el/st.goal),st.done)}<div class="ring-c"><span>${t("fastingNow")}</span><strong class="num" id="fEl">${clock(st.el)}</strong><span>${t("ofH").replace("{h}",st.goal)}</span></div></div>
      <div class="num" id="fLeft" style="font-weight:600">${fastLeftText(st)}</div><div class="small muted" id="fStage" style="margin-top:4px">${fastStage(st.el)}</div>
      <div class="grid2" style="margin-top:12px"><button class="btn" id="fEnd">${t("endFast")}</button><button class="btn ghost" id="fEdit">${t("editStart")}</button></div>
      <div id="fEditBox" hidden style="text-align:left">${startBox(t("save"))}</div>
      <div class="note" style="margin-top:10px;text-align:left">${t("fastAllowed")}</div></section>`
    :`<section class="card"><h3>${t("fastPlan")}</h3><div class="seg" id="fplan" style="margin-top:8px">${FPLANS.map(h=>`<button data-h="${h}" aria-pressed="${F.plan===h}">${h}:${24-h}</button>`).join("")}</div>
      <div class="small muted" style="margin-top:6px">${t("fastHow").replace("{f}",F.plan).replace("{e}",24-F.plan)}</div>
      <button class="btn" id="fStart" style="margin-top:12px">⏳ ${t("startFast")}</button>${startBox(t("startAt"))}</section>`;
  const hist=`<section class="card"><div class="meal-h"><h3>${t("fastHist")}</h3>${sk?`<span class="kc num">🔥 ${sk} ${t("fastStreak")}</span>`:""}</div>
    ${H.length?H.map((h,i)=>{const d=(h.e-h.s)/36e5,ok=d>=h.g;return `<div class="entry"><div class="nm"><div>${dayLabel(dk(h.e))}</div><small class="num">${tmLabel(h.s)} – ${tmLabel(h.e)} · ${t("goal")} ${h.g} ${t("hShort")}</small></div><span class="kc num" style="color:${ok?"var(--good)":"var(--muted)"}">${ok?"✓ ":""}${dur(d)}</span><button class="x" data-fdel="${i}" aria-label="${t("del")}">✕</button></div>`}).join(""):`<div class="empty">${t("noFasts")}</div>`}</section>`;
  $("#view").innerHTML=seg+(S.profile.dm?`<div class="alert">⚠ ${t("fastDm")}</div>`:"")+main+hist+`<div class="note">${t("fastSafe")}</div>`;
  $("#fplan")?.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;F.plan=+b.dataset.h;save();viewPlans()});
  $("#fStart")?.addEventListener("click",()=>{startFast();viewPlans()});
  $("#fStartSet")?.addEventListener("click",()=>{const v=atTime($("#fStartT").value);if(!v)return;if(st){F.start=v;F.notified=false;save()}else startFast(v);viewPlans()});
  $("#fEnd")?.addEventListener("click",()=>{endFast();viewPlans()});
  $("#fEdit")?.addEventListener("click",()=>{$("#fEditBox").hidden=!$("#fEditBox").hidden});
  document.querySelectorAll("[data-fdel]").forEach(b=>b.onclick=()=>{F.hist.splice(+b.dataset.fdel,1);save();viewPlans()})}

    const L=(S.logs[viewDay]=S.logs[viewDay]||[]);L.push(entryFrom(f,{mode:"gram",ui:0,size:"m",qty:1,grams:eat,oil:"normal"},meal,pre.thumb));
    save();closeSheet();render();toast(t("added")+": "+name)}}

/* ---------- wiring ---------- */
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;window.scrollTo(0,0);render()});
$("#plusBtn").onclick=()=>openAdd();
$("#profileBtn").onclick=openProfile;
$("#remBtn").onclick=openReminders;
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;save();render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function route(h){h=String(h||"").replace(/^#/,"");const P={plans:"diet",diet:"diet",fast:"fast",fasting:"fast",recipes:"recipes"};
  if(h in P){tab="recipes";planSeg=P[h];return true}if(h in {today:1,report:1,coach:1}){tab=h;return true}return false}
route(location.hash);
render();
window.addEventListener("hashchange",()=>{if(route(location.hash)){closeSheet();window.scrollTo(0,0);render()}});
navigator.serviceWorker?.addEventListener("message",e=>{if(e.data&&e.data.type==="open"&&route(e.data.hash)){closeSheet();window.scrollTo(0,0);render()}});
setInterval(remTick,30000);setTimeout(remTick,1500);setInterval(fastLive,10000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)remTick()});
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
